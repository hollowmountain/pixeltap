<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#FFF7F8">
<meta name="format-detection" content="telephone=no">
<!--if:yandex_verify--><meta name="yandex-verification" content="{{yandex_verify}}"><!--endif-->
<!--if:google_verify--><meta name="google-site-verification" content="{{google_verify}}"><!--endif-->

<meta property="og:type" content="website">
<meta property="og:site_name" content="PixelTap">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/img/og.jpg?v={{v:img/og.jpg}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Средства PixelTap на розовом граните среди пионов">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico?v={{v:favicon.ico}}" sizes="32x32">
<link rel="icon" href="/favicon.svg?v={{v:favicon.svg}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{v:apple-touch-icon.png}}">
<link rel="manifest" href="/site.webmanifest?v={{v:site.webmanifest}}">

<link rel="preload" href="/fonts/unbounded-cyrillic.woff2?v={{v:fonts/unbounded-cyrillic.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded-latin.woff2?v={{v:fonts/unbounded-latin.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/onest-cyrillic.woff2?v={{v:fonts/onest-cyrillic.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/onest-latin.woff2?v={{v:fonts/onest-latin.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css?v={{v:css/site.css}}">
<script src="/js/site.js?v={{v:js/site.js}}" defer></script>
<!--if:metrika--><script src="/js/consent.js?v={{v:js/consent.js}}" defer></script><!--endif-->
